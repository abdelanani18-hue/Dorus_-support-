<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>دخول | دروس+</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<div class="auth-box">
  <h2>🔑 تسجيل الدخول</h2>
  <input type="email"    id="email" placeholder="البريد الإلكتروني">
  <input type="password" id="pass"  placeholder="كلمة المرور">
  <button onclick="handleLogin()">دخول</button>
  <p><a href="register.html">ليس لديك حساب؟ سجّل الآن</a></p>
  <div id="err" class="err-msg"></div>
</div>
<script type="module">
  import { login } from './js/auth.js';
  window.handleLogin = async () => {
    try {
      await login(
        document.getElementById('email').value,
        document.getElementById('pass').value
      );
    } catch(e) {
      document.getElementById('err').textContent = 'خطأ: ' + e.message;
    }
  };
</script>
</body>
</html>
