<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>لوحة الأستاذ | دروس+</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
  <div class="logo">📚 دروس+</div>
  <button onclick="handleLogout()" class="btn-logout">خروج</button>
</nav>
<div class="dashboard">
  <h2 id="welcome">مرحباً أستاذ...</h2>
  <div class="stats">
    <div class="stat"><div class="num" id="totalEarnings">0</div><div class="lbl">دج مكتسبة</div></div>
    <div class="stat"><div class="num" id="totalSessions">0</div><div class="lbl">حصص مكتملة</div></div>
    <div class="stat"><div class="num" id="pendingCount">0</div><div class="lbl">حجوزات قيد الانتظار</div></div>
  </div>
  <h3 style="margin:20px 0 10px">الحجوزات الأخيرة</h3>
  <div id="bookingsList" class="bookings-list"></div>
</div>
<script type="module">
  import { watchAuth, logout } from './js/auth.js';
  import { getProfBookings }   from './js/bookings.js';
  window.handleLogout = logout;
  watchAuth(async (user, data) => {
    if (!user || data.role !== 'prof') { location.href='login.html'; return; }
    document.getElementById('welcome').textContent = 'مرحباً ' + data.name;
    const bookings = await getProfBookings(user.uid);
    const list = document.getElementById('bookingsList');
    bookings.forEach(b => {
      list.innerHTML += `<div class="booking-card">
        <span>حجز #${b.id.slice(0,6)}</span>
        <span>${b.profAmount} دج</span>
        <span class="status ${b.status}">${b.status}</span>
      </div>`;
    });
  });
</script>
</body>
</html>
