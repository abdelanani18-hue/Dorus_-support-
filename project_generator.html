import { getAuth }       from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore }  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ⚠️ استبدل هذه القيم من Firebase Console → Project Settings
const firebaseConfig = {
  apiKey:            "YOUR_API_KEY",
  authDomain:        "YOUR_PROJECT.firebaseapp.com",
  projectId:         "YOUR_PROJECT_ID",
  storageBucket:     "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",

};

    name:"js/auth.js", icon:"🛡️", title:"نظام المصادقة",
    desc:"تسجيل / دخول / خروج / مراقبة الجلسة",
    content:`import { auth, db } from "./firebase-config.js";
import { createUserWithEmailAndPassword, signInWithEmailAndPassword,
         signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { doc, setDoc, getDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

export async function register(email, password, role, extra) {
  const cred = await createUserWithEmailAndPassword(auth, email, password);
  const uid  = cred.user.uid;
  await setDoc(doc(db,"users",uid), { uid, email, role, createdAt: new Date(), ...extra });
  if (role === "prof")
    await setDoc(doc(db,"professors",uid), {
      uid, name: extra.name||"", subjects:[], levels:[],
      wilaya: extra.wilaya||"", price:0, bio:"", rating:0, reviews:0, available:true
    });
  return cred.user;
}

export async function login(email, password) {
  const cred = await signInWithEmailAndPassword(auth, email, password);
  const snap = await getDoc(doc(db,"users",cred.user.uid));
  const data = snap.data();
  location.href = data.role === "prof" ? "dashboard-prof.html" : "dashboard-eleve.html";
}

export async function logout() {
  await signOut(auth);
  location.href = "index.html";
}

export function watchAuth(cb) {
  onAuthStateChanged(auth, async user => {
    if (user) {
      const snap = await getDoc(doc(db,"users",user.uid));
      cb(user, snap.data());
    } else { cb(null, null); }
  });
}`
  }
];

// ===== بناء الواجهة =====
const grid = document.getElementById('grid');
files.forEach((f, i) => {
  grid.innerHTML += `
    <div class="card">
      <div class="icon">${f.icon}</div>
      <h3>${f.name}</h3>
      <p>${f.desc}</p>
      <button class="dl-btn" id="btn${i}" onclick="dl(${i})">⬇️ تنزيل</button>
    </div>`;
});

function dl(i) {
  const f    = files[i];
  const blob = new Blob([f.content], { type: 'text/plain;charset=utf-8' });
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = f.name.includes('/') ? f.name.split('/').pop() : f.name;
  a.click();
  const btn = document.getElementById('btn' + i);
  btn.textContent = '✅ تم التنزيل';
  btn.classList.add('done');
}

function downloadAll() {
  files.forEach((_, i) => {
    setTimeout(() => dl(i), i * 600);
  });
}
</script>
